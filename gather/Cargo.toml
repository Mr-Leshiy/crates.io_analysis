[package]
name = "gather"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
bytes = "1.11.0"
cargo = { version = "=0.94.0", git = "https://github.com/rust-lang/cargo.git" }
cargo-deny = "0.18.5"
clap = { version = "4.5.50", features = ["derive"] }
crossbeam-channel = "0.5.15"
csv = "1.4.0"
flate2 = "1.1.5"
futures = "0.3.31"
git2 = "0.20.2"
home = "0.5.12"
indicatif = "0.18.3"
krates = "0.20.0"
log = "0.4.28"
rand = "0.9.2"
rayon = "1.11.0"
reqwest = "0.12.24"
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
strum = "0.27.2"
tar = "0.4.44"
tempdir = "0.3.7"
tokio = { version = "1.48.0", features = ["macros"] }
toml = "0.9.8"
tracing = "0.1.41"
tracing-indicatif = "0.3.13"
tracing-subscriber = "0.3.20"
walkdir = "2.5.0"
