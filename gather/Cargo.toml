[package]
name = "gather"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
bytes = "1.10.1"
cargo = { version = "=0.94.0", git = "https://github.com/rust-lang/cargo.git" }
cargo-deny = "0.18.5"
clap = { version = "4.5.50", features = ["derive"] }
crossbeam-channel = "0.5.15"
csv = "1.4.0"
flate2 = "1.1.5"
home = "0.5.12"
krates = "0.20.0"
log = "0.4.28"
reqwest = "0.12.24"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
strum = "0.27.2"
tar = "0.4.44"
tempdir = "0.3.7"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
